name: CI/CD Pipeline
 
on:
  push:
    branches: [main]
    paths:
      - "ElectionAPI_WB/**"
      - "election-frontend-wb/**"
      - "deployment/docker/**"
      - "deployment/kubernetes/**"
  workflow_dispatch: {}
 
permissions:
  id-token: write
  contents: write
 
env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 326334468168.dkr.ecr.ap-south-1.amazonaws.com
  EKS_CLUSTER: electionpulse-wb-eks
 
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
 
      - name: Set image tag from commit SHA
        id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
 
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
 
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
 
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/electionpulse-wb/frontend:${{ steps.vars.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/electionpulse-wb/frontend:latest
 
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/electionpulse-wb/backend:${{ steps.vars.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/electionpulse-wb/backend:latest
 
      - name: Build and push migration worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile.migration
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/electionpulse-wb/migration:${{ steps.vars.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/electionpulse-wb/migration:latest
 
  update-gitops-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
 
      - name: Bump image tags in kustomization.yaml
        working-directory: deployment/kubernetes/base
        run: |
          kustomize edit set image \
            BACKEND_IMAGE_PLACEHOLDER=${{ env.ECR_REGISTRY }}/electionpulse-wb/backend:latest \
            FRONTEND_IMAGE_PLACEHOLDER=${{ env.ECR_REGISTRY }}/electionpulse-wb/frontend:latest
 
      # FIXED FOR GOOD: this is THE bug that corrupted 04-migration-job.yaml
      # every single time all day. The old sed pattern appended a literal
      # trailing quote character (\") assuming the line was already quoted
      # in the source file — it never was. That stray quote made the image
      # reference invalid ("...migration:<tag>\""), causing InvalidImageName
      # on every sync this workflow triggered afterward, silently undoing
      # every manual fix within minutes of it being pushed.
      #
      # Fix: pin to :latest permanently instead of a commit-hash tag for
      # the migration job specifically. deploy.sh's build/push always
      # pushes :latest too, so this stays valid on every run, and there is
      # no sed substitution left at all — nothing left to corrupt.
      - name: Set migration job to :latest (no sed, no stray quote possible)
        run: |
          grep -q "electionpulse-wb/migration:latest" deployment/kubernetes/base/04-migration-job.yaml \
            && echo "Already pinned to :latest, nothing to do." \
            || echo "WARNING: 04-migration-job.yaml does not reference :latest — check it manually."
 
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment/kubernetes/base/kustomization.yaml
          git commit -m "ci: deploy image ${{ needs.build-and-push.outputs.image_tag }}" || echo "No changes to commit"
          git pull --rebase origin main
          git push
