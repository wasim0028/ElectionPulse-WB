apiVersion: batch/v1
kind: Job
metadata:
  name: rds-data-migration
  namespace: election
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 1
  template:
    spec:
      containers:
        - name: migration-worker
          image: 326334468168.dkr.ecr.ap-south-1.amazonaws.com/electionpulse-wb/migration:c1f04c8"
          env:
            - name: DB_SERVER
              valueFrom:
                secretKeyRef:
                  name: election-db-secret
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: election-db-secret
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: election-db-secret
                  key: DB_PASS
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: election-config
                  key: DB_NAME
            - name: AWS_REGION
              value: "ap-south-1"
            - name: S3_BUCKET
              value: "biryani-bucket-0027"
            - name: BACKUP_S3_KEY
              value: "backups/Test_Wasim.bak"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: secret-access-key
                  optional: true
      restartPolicy: Never
