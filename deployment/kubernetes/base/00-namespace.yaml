# ── ConfigMap — shared app config ─────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: election-config
  namespace: election
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:5080"
  DB_PORT: "1433"
  DB_NAME: "ElectionDB"
---
# ── Secret — database credentials, bootstrapped out-of-band ──────────────────
apiVersion: v1
kind: Secret
metadata:
  name: election-db-secret
  namespace: election
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
